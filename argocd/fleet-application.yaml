apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-commander
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vholubiuk/fleet-commander.git
    targetRevision: main
    path: helm/fleet-commander

    helm:
      releaseName: fleet

  destination:
    server: https://kubernetes.default.svc
    namespace: fleet

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true