apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-commander-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fleet-commander.json: |
    {
      "title": "Fleet Commander",
      "uid": "fleet-commander",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "stat",
          "title": "Active Ships",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "max(fleet_ships_active)",
              "legendFormat": "Active ships"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Fleet Capacity",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "max(fleet_capacity)",
              "legendFormat": "Fleet capacity"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests Rate",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(fleet_requests_total[1m]))",
              "legendFormat": "requests/sec"
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }