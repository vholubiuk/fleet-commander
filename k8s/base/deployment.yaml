apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-commander
  namespace: fleet
  labels:
    app: fleet-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-commander
  template:
    metadata:
      labels:
        app: fleet-commander
    spec:
      containers:
      - name: fleet-commander
        image: ghcr.io/vholubiuk/fleet-commander:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi